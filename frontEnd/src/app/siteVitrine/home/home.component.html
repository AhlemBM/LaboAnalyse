<!-- Hero Section -->
<section id="hero" class="text-center py-5 bg-primary text-white">
  <div class="container">
    <h1 class="display-4">Votre santé, notre priorité</h1>
    <p class="lead">Des analyses médicales rapides et fiables</p>
    <a href="#appointment" class="btn btn-light mt-3">Prendre rendez-vous</a>
  </div>
</section>

<!-- Prendre Rendez-vous -->
<section id="appointment" class="bg-light py-5">
  <div class="container text-center">
    <h2 class="mb-4">Prendre Rendez-vous</h2>
    <form class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Nom" required>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="date" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
  </div>
</section>

<!-- Contact -->
<!-- Contact -->
<section id="contact" class="bg-light py-5">
  <div class="container">
    <h2 class="text-center mb-4">Contact</h2>
    <div class="row g-4">
      <!-- Coordonnées -->
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Coordonnées</h5>
            <p>Email : <a href="mailto:contact@labo-sante.com">contact&#64;labo-sante.com</a></p>
            <p>Téléphone : +216 99 999 999</p>
            <p>Adresse : Centre Médical, Tunis</p>
          </div>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Envoyez-nous un message</h5>
            <form action="https://formsubmit.co/ahlem18896@gmail.com" method="POST">
            <input type="hidden" name="_captcha" value="false">

            <div class="mb-3">
                <input type="text" name="name" class="form-control" placeholder="Votre nom" required>
              </div>
              <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Votre email" required>
              </div>
              <div class="mb-3">
                <textarea name="message" class="form-control" rows="4" placeholder="Votre message" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Envoyer</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
