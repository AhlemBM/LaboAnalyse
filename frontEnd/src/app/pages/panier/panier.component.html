<!-- Confirmation de commande -->
<div  class="confirmation-section">
  <h3>📝 Confirmation de la commande</h3>

  <label for="adresse">Adresse de livraison :</label>
  <textarea id="adresse" [(ngModel)]="adresse" class="form-control" rows="3" placeholder="Entrez votre adresse..."></textarea>

  <h4>📦 Produits commandés :</h4>
  <ul>
    <li *ngFor="let item of panier">
      {{ item.kit.nom }} - {{ item.quantite }} x {{ item.kit.prix }} DT = {{ (item.quantite * item.kit.prix).toFixed(2) }} DT
    </li>
  </ul>

  <p><strong>Total :</strong> {{ calculerTotal() }} DT</p>

  <button class="btn btn-primary" (click)="confirmerCommande()">✅ Confirmer la commande</button>
  <button class="btn btn-secondary ms-2" (click)="confirmationEnCours = false">❌ Annuler</button>
</div>
