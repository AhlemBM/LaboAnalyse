<div class="container">
  <h2>🛒 Mon Panier</h2>

  <div *ngIf="panier.length === 0">Votre panier est vide.</div>

  <table class="table" *ngIf="panier.length > 0">
    <thead>
    <tr>
      <th>Image</th>
      <th>Nom</th>
      <th>Prix</th>
      <th>Quantité</th>
      <th>Total</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of panier">
      <td><img *ngIf="item.kit.img" [src]="item.kit.img" alt="Kit Image" width="50"></td>
      <td>{{ item.kit.nom }}</td>
      <td>{{ item.kit.prix }} DT</td>

      <!-- Champ de saisie pour modifier la quantité -->
      <td>
        <input type="number" [(ngModel)]="item.quantite" min="1" (change)="updateQuantity(item)"/>
      </td>

      <!-- Affichage du total pour chaque article -->
      <td>{{ (item.kit.prix * item.quantite).toFixed(2) }} DT</td>

      <td>
        <button class="btn btn-danger" (click)="supprimerDuPanier(item.id)">🗑 Supprimer</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Affichage du total du panier -->
  <div *ngIf="panier.length > 0">
    <h4>Total: {{ calculerTotal() }} DT</h4>
    <button class="btn btn-success" (click)="validerCommande()">✅ Valider la commande</button>
  </div>
</div>
