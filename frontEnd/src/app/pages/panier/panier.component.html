<!-- Tableau des produits commandés -->
<div class="confirmation-section">
  <h3>📝 Confirmation de la commande</h3>

  <h4>📦 Produits commandés :</h4>
  <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-dark">
      <tr>
        <th>Nom</th>
        <th>Quantité</th>
        <th>Prix unitaire (DT)</th>
        <th>Total (DT)</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of panier; let i = index">
        <td>{{ item.kit.nom }}</td>
        <td>
          <div class="d-flex align-items-center justify-content-center">
            <button class="btn btn-sm btn-outline-secondary me-1" (click)="modifierQuantite(i, -1)">➖</button>
            <span>{{ item.quantite }}</span>
            <button class="btn btn-sm btn-outline-secondary ms-1" (click)="modifierQuantite(i, 1)">➕</button>
          </div>
        </td>
        <td>{{ item.kit.prix }}</td>
        <td>{{ (item.quantite * item.kit.prix).toFixed(2) }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="supprimerArticle(i)">🗑 Supprimer</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>



  <!-- Total + Actions -->
  <p class="fs-5"><strong>Total :</strong> {{ calculerTotal() }} DT</p>

  <button class="btn btn-success" (click)="allerPaiement()">✅ Confirmer</button>
  <button class="btn btn-secondary ms-2" (click)="annuler()">❌ Annuler</button>
</div>
