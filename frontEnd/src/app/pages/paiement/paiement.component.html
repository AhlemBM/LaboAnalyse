<div class="container paiement-container my-4 p-4 shadow rounded bg-light">
  <h3 class="mb-4">💳 Paiement</h3>

  <!-- Informations utilisateur -->
  <div class="row mb-3">
    <div class="col-md-6 mb-3">
      <label for="nom" class="form-label">👤 Nom complet</label>
      <input id="nom" type="text" [(ngModel)]="nom" class="form-control" placeholder="Entrez votre nom">
    </div>
    <div class="col-md-6 mb-3">
      <label for="telephone" class="form-label">📞 Numéro de téléphone</label>
      <input id="telephone" type="tel" [(ngModel)]="telephone" class="form-control" placeholder="Entrez votre téléphone">
    </div>
    <div class="col-12">
      <label for="adresse" class="form-label">🏠 Adresse de livraison</label>
      <textarea id="adresse" [(ngModel)]="adresse" class="form-control" rows="3" placeholder="Votre adresse complète..."></textarea>
    </div>
  </div>

  <!-- Mode de paiement -->
  <div class="mb-3">
    <label class="form-label">💰 Mode de paiement</label>
    <div class="d-flex gap-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="modePaiement" id="espece" [(ngModel)]="modePaiement" value="espece">
        <label class="form-check-label" for="espece">Espèces à la livraison</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="modePaiement" id="carte" [(ngModel)]="modePaiement" value="carte">
        <label class="form-check-label" for="carte">Carte bancaire</label>
      </div>
    </div>
  </div>

  <!-- Total et bouton -->
  <div class="mt-4 border-top pt-3 d-flex justify-content-between align-items-center">
    <p class="mb-0 fs-5"><strong>Total :</strong> {{ total }} DT</p>
    <button class="btn btn-success" (click)="confirmerPaiement()">✅ Confirmer la commande</button>
  </div>
</div>
