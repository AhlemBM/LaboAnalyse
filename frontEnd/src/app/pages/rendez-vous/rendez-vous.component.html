<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card shadow-sm p-4">
        <h4 class="mb-4">Prendre un rendez-vous</h4>
        <form [formGroup]="rendezvousForm" (ngSubmit)="prendreRendezvous()">
          <div *ngIf="messageSuccess" class="alert alert-success alert-dismissible fade show" role="alert">
            {{ messageSuccess }}
            <button type="button" class="btn-close" (click)="messageSuccess = null"></button>
          </div>

          <div class="row">
            <!-- Colonne gauche -->
            <div class="col-md-6">
              <!-- Nom -->
              <div class="mb-3">
                <input type="text" formControlName="nom" class="form-control" placeholder="Nom"
                       [ngClass]="{'is-invalid': rendezvousForm.get('nom')?.invalid && rendezvousForm.get('nom')?.touched}">
                <div *ngIf="rendezvousForm.get('nom')?.invalid && rendezvousForm.get('nom')?.touched" class="invalid-feedback">
                  Le nom est requis.
                </div>
              </div>

              <!-- Prénom -->
              <div class="mb-3">
                <input type="text" formControlName="prenom" class="form-control" placeholder="Prénom"
                       [ngClass]="{'is-invalid': rendezvousForm.get('prenom')?.invalid && rendezvousForm.get('prenom')?.touched}">
                <div *ngIf="rendezvousForm.get('prenom')?.invalid && rendezvousForm.get('prenom')?.touched" class="invalid-feedback">
                  Le prénom est requis.
                </div>
              </div>

              <!-- Numéro de téléphone -->
              <div class="mb-3">
                <input type="text" formControlName="numTel" class="form-control" placeholder="Numéro de téléphone"
                       [ngClass]="{'is-invalid': rendezvousForm.get('numTel')?.invalid && rendezvousForm.get('numTel')?.touched}">
                <div *ngIf="rendezvousForm.get('numTel')?.invalid && rendezvousForm.get('numTel')?.touched" class="invalid-feedback">
                  Numéro de téléphone requis (10 chiffres).
                </div>
              </div>

              <!-- Date et Heure -->
              <div class="mb-3">
                <input type="datetime-local" formControlName="dateHeure" class="form-control"
                       [ngClass]="{'is-invalid': rendezvousForm.get('dateHeure')?.invalid && rendezvousForm.get('dateHeure')?.touched}">
                <div *ngIf="rendezvousForm.get('dateHeure')?.invalid && rendezvousForm.get('dateHeure')?.touched" class="invalid-feedback">
                  La date et l'heure sont requises.
                </div>
              </div>
            </div>

            <!-- Colonne droite -->
            <div class="col-md-6">
              <!-- Test -->
              <div class="mb-3">
                <select formControlName="testId" class="form-control"
                        [ngClass]="{'is-invalid': rendezvousForm.get('testId')?.invalid && rendezvousForm.get('testId')?.touched}">
                  <option value="">Choisir un test</option>
                  <option *ngFor="let test of tests" [value]="test.id">{{ test.nom }}</option>
                </select>
                <div *ngIf="rendezvousForm.get('testId')?.invalid && rendezvousForm.get('testId')?.touched" class="invalid-feedback">
                  Veuillez sélectionner un test.
                </div>
              </div>

              <!-- Lieu -->
              <div class="mb-3">
                <select formControlName="lieu" class="form-control" (change)="onLieuChange($event)"
                        [ngClass]="{'is-invalid': rendezvousForm.get('lieu')?.invalid && rendezvousForm.get('lieu')?.touched}">
                  <option value="">Sélectionner un lieu</option>
                  <option value="domicile">Domicile</option>
                  <option value="labo">Labo</option>
                </select>
                <div *ngIf="rendezvousForm.get('lieu')?.invalid && rendezvousForm.get('lieu')?.touched" class="invalid-feedback">
                  Le lieu est requis.
                </div>
              </div>

              <!-- Adresse -->
              <div class="mb-3" *ngIf="rendezvousForm.get('lieu')?.value === 'domicile'">
                <input type="text" formControlName="adresse" class="form-control" placeholder="Adresse (si domicile)">
              </div>

              <!-- Notes -->
              <div class="mb-3">
                <textarea formControlName="notes" class="form-control" rows="3" placeholder="Notes (facultatif)"></textarea>
              </div>
            </div>
          </div>

          <!-- Bouton -->
          <div class="text-end mt-3">
            <button type="submit" class="btn btn-primary" [disabled]="rendezvousForm.invalid">
              Prendre Rendez-vous
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
