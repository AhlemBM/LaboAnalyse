<div class="register-container">
  <form (submit)="register()">
    <div class="left-column">
      <h2>Inscription</h2>

      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" [(ngModel)]="nom" name="nom" required>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" [(ngModel)]="prenom" name="prenom" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <input type="password" id="motDePasse" [(ngModel)]="motDePasse" name="motDePasse" required>
      </div>
    </div>

    <div class="right-column">
      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" [(ngModel)]="telephone" name="telephone" required>
      </div>

      <div class="form-group">
        <label for="dateNaissance">Date de naissance</label>
        <input type="date" id="dateNaissance" [(ngModel)]="dateNaissance" name="dateNaissance" required>
      </div>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

      <button type="submit">S'inscrire</button>

      <div class="register-link">
        <p>Vous avez déjà un compte ? <a routerLink="/login">Se connecter</a></p>
      </div>
    </div>
  </form>
</div>
