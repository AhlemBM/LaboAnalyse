<div class="p-4 mb-4 border rounded shadow">
  <h2>Contactez-nous</h2>

  <form [formGroup]="contactForm" (ngSubmit)="sendMessage()">
    <div class="mb-4">
      <label for="name" class="font-semibold">Nom</label>
      <input id="name" formControlName="name" type="text" class="p-2 border rounded w-full" required />
    </div>

    <div class="mb-4">
      <label for="email" class="font-semibold">Email</label>
      <input id="email" formControlName="email" type="email" class="p-2 border rounded w-full" required />
    </div>

    <div class="mb-4">
      <label for="message" class="font-semibold">Message</label>
      <textarea id="message" formControlName="message" rows="4" class="p-2 border rounded w-full" required></textarea>
    </div>

    <button type="submit" class="btn-sm">Envoyer</button>
  </form>

  <p *ngIf="successMessage" class="text-green-600 mt-4">{{ successMessage }}</p>
  <p *ngIf="errorMessage" class="text-yellow-600 mt-4">{{ errorMessage }}</p>
</div>
